<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Macondo&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="TravelBook.css" />
</head>
<body>
  <!--
    LAYOUT: TravelBook.html + TravelBook.css + TravelBook-ui.js
    DATA: loads TravelBook.md in the browser (use npm run serve:travel, then refresh after edits).
    Fallback: TravelBook-data.js from npm run build:travel
    Map: TravelMap.html (same source). Zone names in the book open the map.
    Simulator: TravelBook.html?embed=1&page=A12 inside simulator.html (Table / Paths / Area exploration).
  -->
  <header class="tb-chrome no-print">
    <h1 class="tb-chrome-title">Travel Book</h1>
    <p class="tb-chrome-nav tb-chrome-nav--standalone">
      <a href="TravelBook.html" aria-current="page">Book</a>
      ·
      <a href="TravelMap.html">Map</a>
    </p>
    <p class="tb-chrome-nav tb-chrome-nav--embed">
      <button type="button" id="tb-return-table">Table</button>
      ·
      <a href="TravelMap.html?embed=1">Map</a>
    </p>
    <p class="tb-chrome-hint tb-embed-hint">Click a Path or Area exploration to go to the table. Table closes the book without moving.</p>
  </header>
  <div class="tb-wrap" id="tb-wrap" data-tb-source="TravelBook.md"></div>
  <script type="module" src="travel-book-parse.js"></script>
  <script src="TravelBook-data.js"></script>
  <script src="TravelBook-ui.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var q = new URLSearchParams(window.location.search);
      var embed = q.get('embed') === '1' || q.get('embed') === 'true';
      if (embed) document.body.classList.add('tb-embed');
      if (window.TravelBook) {
        window.TravelBook.mount(document.getElementById('tb-wrap'), {
          source: 'TravelBook.md',
          embed: embed
        });
      }
      var ret = document.getElementById('tb-return-table');
      if (ret) {
        ret.addEventListener('click', function () {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'tb-sim', action: 'close' }, '*');
          }
        });
      }
    });
  </script>
</body>
</html>
